[package]
name = "orfeus-native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
ash = { version = "=0.38.0", default-features = false, features = ["loaded", "std"] }
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "tiff"] }
jpeg-encoder = { version = "=0.7.1", features = ["simd"] }
lensfun = "=0.7.0"
md-5 = "=0.10.6"
mimalloc = { version = "=0.1.48", default-features = false, optional = true }
rpmalloc = { version = "=0.2.2", optional = true }
rawler = "=0.7.2"
rayon = "=1.12.0"
sha2 = "=0.10.9"

[build-dependencies]

[features]
# Both measured on a 13700H at 20 MP, medians of three full exports: system
# 1316 ms, mimalloc 1323 ms, rpmalloc 1487 ms. Neither helps and rpmalloc hurts,
# because a render allocates a handful of whole-image buffers rather than the
# many small ones these allocators are built for. Kept as switches so the
# question can be re-measured rather than re-argued.
mimalloc-allocator = ["mimalloc"]
rpmalloc-allocator = ["rpmalloc"]

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
