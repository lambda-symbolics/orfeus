[package]
name = "orfeus-native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "tiff"] }
lensfun = "=0.7.0"
md-5 = "=0.10.6"
rawler = "=0.7.2"
rayon = "=1.12.0"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
