[package]
name = "orfeus-native"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
flate2 = { version = "=1.1.2", default-features = false, features = ["rust_backend"] }
md-5 = "=0.10.6"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = "symbols"
